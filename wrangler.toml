#:schema node_modules/wrangler/config-schema.json
name = "edumakers"
main = ".open-next/worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ==========================================================
# D1 (SQLite) — 교체 필요: `wrangler d1 create edumakers-db`
# ==========================================================
[[d1_databases]]
binding = "DB"
database_name = "edumakers-db"
database_id = "8696a8ef-afbb-47a5-b180-e9a2eadc40d4"
migrations_dir = "drizzle/migrations"

# ==========================================================
# R2 — 배포 당시 R2가 계정에 미활성화. dashboard.cloudflare.com
# > R2 > Enable 후 아래 주석 해제 + `pnpm r2:create`
# ==========================================================
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "edumakers-media"
#
# [[r2_buckets]]
# binding = "DOCS"
# bucket_name = "edumakers-docs"

# ==========================================================
# KV — sessions / rate limit / cache
# ==========================================================
[[kv_namespaces]]
binding = "KV"
id = "42d961d15bbf4e71b19a6655522ba246"

# OpenNext ISR incremental cache (동일 KV namespace 재사용)
[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "42d961d15bbf4e71b19a6655522ba246"

# ==========================================================
# Vars (non-secret)
# ==========================================================
[vars]
APP_NAME = "EduMakers"
APP_URL = "https://edumakers.pages.dev"

# ==========================================================
# Cron triggers (Cloudflare Workers)
# 매주 월요일 오전 8시 KST (= 일요일 23시 UTC) 주간 다이제스트
# ==========================================================
[triggers]
crons = ["0 23 * * 0"]

# ==========================================================
# 환경변수 (secrets) 는 `wrangler pages secret put <NAME>` 로 설정
# - BETTER_AUTH_SECRET
# - RESEND_API_KEY
# - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# - KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET
# - TURNSTILE_SECRET_KEY
# - OPENAI_API_KEY
# ==========================================================
